[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "used-cars-spark-pipeline"
version = "0.1.0"
description = "Reproducible local PySpark ETL, data quality and asking-price analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pyspark==3.5.7",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "matplotlib==3.10.0",
  "pymongo==4.11.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13", "nbformat==5.10.4", "nbclient==0.10.2"]
notebooks = ["jupyterlab==4.4.3", "ipykernel==6.29.5"]

[project.scripts]
cars = "used_cars.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
used_cars = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mongo: requires a live MongoDB at TEST_MONGO_URI"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

